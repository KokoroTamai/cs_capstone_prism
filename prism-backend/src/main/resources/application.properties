# 1. Pooler 経由の JDBC URL（環境変数があれば優先、なければデフォルト値を使用）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require}

# 2. ユーザー名
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.xbpqdbjpfutwuwvxivmp}

# 3. Supabase DB パスワード（環境変数があれば優先、なければコロン後ろの値を使用）
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Coco1f27@0112}

# 4. ドライバ
spring.datasource.driver-class-name=org.postgresql.Driver

# 5. JPA / Hibernate 設定
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 接続確認前の Dialect 自動判定失敗を防ぐために明示
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL に複数の INSERT を1回でまとめさせる（劇的に高速化）
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Hibernate のバッチインサートを有効化 (50件ずつまとめて送信)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true